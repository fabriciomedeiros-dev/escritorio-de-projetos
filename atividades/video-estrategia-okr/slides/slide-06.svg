<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#132b4d"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39d8c2" stop-opacity=".24"/><stop offset="1" stop-color="#b793ff" stop-opacity=".08"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1690" cy="120" r="300" fill="url(#glow)" stroke="none" stroke-width="0"/><circle cx="160" cy="920" r="360" fill="#0f2340" stroke="none" stroke-width="0"/><text x="108" y="74" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="2">ESCRITÓRIO DE PROJETOS  /  ESTRATÉGIA DE TI</text><text x="108" y="157" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="2">COMPARAR ALTERNATIVAS</text><text x="108" y="244" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Desenvolver ou contratar?</text><text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#a9bad1" text-anchor="start" letter-spacing="0">Avaliar o mesmo escopo e horizonte; comparar custo total e capacidade.</text><path d="M108 1017 L1812 1017" stroke="#355072" stroke-width="2" stroke-linecap="round" fill="none"/><text x="108" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">OKRs orientam o roadmap. Valoração demonstra a contribuição.</text><text x="1812" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="end" letter-spacing="1">06  /  08</text><rect x="108" y="380" width="800" height="510" rx="30" fill="#132645" stroke="#ffbd59" stroke-width="2"/><text x="158" y="446" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffbd59" text-anchor="start" letter-spacing="2">SOLUÇÃO EXTERNA</text><text x="158" y="514" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">R$ 10.000</text><text x="158" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">implantação</text><text x="495" y="514" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="0">+</text><text x="560" y="514" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">R$ 800</text><text x="560" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">por mês</text><path d="M158 594 L856 594" stroke="#355072" stroke-width="2" stroke-linecap="round" fill="none"/><text x="158" y="673" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#ffbd59" text-anchor="start" letter-spacing="0">R$ 19.600</text><text x="158" y="715" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">no primeiro ano</text><text x="158" y="790" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">antes de tributos, integração e outros custos</text><rect x="1010" y="380" width="802" height="510" rx="30" fill="#132645" stroke="#39d8c2" stroke-width="2"/><text x="1060" y="446" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="2">DESENVOLVIMENTO INTERNO</text><text x="1060" y="514" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Não é custo zero</text><text x="1060" y="592" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Horas da equipe + infraestrutura</text><text x="1060" y="642" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Suporte + manutenção + evolução</text><text x="1060" y="692" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Capacidade desviada de outras prioridades</text><rect x="1060" y="761" width="634" height="20" rx="10" fill="#243c5d" stroke="none" stroke-width="0"/><rect x="1060" y="761" width="452" height="20" rx="10" fill="#39d8c2" stroke="none" stroke-width="0"/><text x="1060" y="825" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="0">Calcular TCO no mesmo horizonte</text><text x="108" y="944" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">Exemplo financeiro ilustrativo. Cenário interno e custos recorrentes devem ser levantados antes da decisão.</text></svg>