<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#132b4d"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39d8c2" stop-opacity=".24"/><stop offset="1" stop-color="#b793ff" stop-opacity=".08"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1690" cy="120" r="300" fill="url(#glow)" stroke="none" stroke-width="0"/><circle cx="160" cy="920" r="360" fill="#0f2340" stroke="none" stroke-width="0"/><text x="108" y="74" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="2">ESCRITÓRIO DE PROJETOS  /  ESTRATÉGIA DE TI</text><text x="108" y="157" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="2">O QUE CONTA COMO VALOR</text><text x="108" y="244" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Valor vai além da receita</text><text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#a9bad1" text-anchor="start" letter-spacing="0">Benefícios econômicos e operacionais podem mover os resultados estratégicos.</text><path d="M108 1017 L1812 1017" stroke="#355072" stroke-width="2" stroke-linecap="round" fill="none"/><text x="108" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">OKRs orientam o roadmap. Valoração demonstra a contribuição.</text><text x="1812" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="end" letter-spacing="1">05  /  08</text><rect x="108" y="390" width="425" height="154" rx="25" fill="#132645" stroke="none" stroke-width="0"/><circle cx="156" cy="438" r="12" fill="#39d8c2" stroke="none" stroke-width="0"/><text x="188" y="447" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="1">EFICIÊNCIA</text><text x="142" y="502" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Menos tempo por atendimento</text><rect x="570" y="390" width="425" height="154" rx="25" fill="#132645" stroke="none" stroke-width="0"/><circle cx="618" cy="438" r="12" fill="#ffbd59" stroke="none" stroke-width="0"/><text x="650" y="447" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffbd59" text-anchor="start" letter-spacing="1">QUALIDADE</text><text x="604" y="502" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Mais acuracidade; menos erros</text><rect x="108" y="582" width="425" height="154" rx="25" fill="#132645" stroke="none" stroke-width="0"/><circle cx="156" cy="630" r="12" fill="#b793ff" stroke="none" stroke-width="0"/><text x="188" y="639" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#b793ff" text-anchor="start" letter-spacing="1">CAPACIDADE</text><text x="142" y="694" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Menos retrabalho; mais entrega</text><rect x="570" y="582" width="425" height="154" rx="25" fill="#132645" stroke="none" stroke-width="0"/><circle cx="618" cy="630" r="12" fill="#75df9f" stroke="none" stroke-width="0"/><text x="650" y="639" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#75df9f" text-anchor="start" letter-spacing="1">CONFIANÇA</text><text x="604" y="694" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Menos risco; melhor serviço</text><rect x="1080" y="390" width="732" height="540" rx="30" fill="#10213c" stroke="none" stroke-width="0"/><text x="1130" y="450" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffbd59" text-anchor="start" letter-spacing="2">EXEMPLO ILUSTRATIVO</text><text x="1130" y="508" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Tempo de atendimento</text><text x="1150" y="588" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="1">ANTES</text><rect x="1300" y="558" width="390" height="40" rx="14" fill="#293e5c" stroke="none" stroke-width="0"/><text x="1150" y="675" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="1">DEPOIS</text><rect x="1300" y="645" width="244" height="40" rx="14" fill="#39d8c2" stroke="none" stroke-width="0"/><text x="1730" y="587" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f4f7fb" text-anchor="end" letter-spacing="0">10 min</text><text x="1730" y="674" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#39d8c2" text-anchor="end" letter-spacing="0">5 min</text><circle cx="1398" cy="807" r="54" fill="#153b4b" stroke="none" stroke-width="0"/><text x="1398" y="817" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#39d8c2" text-anchor="middle" letter-spacing="0">−50%</text><text x="1480" y="816" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">menos tempo por atendimento</text><text x="108" y="886" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">A redução de quadro não se presume: só é benefício quando o resultado for confirmado e validado.</text></svg>