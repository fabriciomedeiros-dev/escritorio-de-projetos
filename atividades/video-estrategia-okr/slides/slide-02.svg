<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#132b4d"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39d8c2" stop-opacity=".24"/><stop offset="1" stop-color="#b793ff" stop-opacity=".08"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1690" cy="120" r="300" fill="url(#glow)" stroke="none" stroke-width="0"/><circle cx="160" cy="920" r="360" fill="#0f2340" stroke="none" stroke-width="0"/><text x="108" y="74" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="2">ESCRITÓRIO DE PROJETOS  /  ESTRATÉGIA DE TI</text><text x="108" y="157" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="2">A LÓGICA DO OKR</text><text x="108" y="244" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">A estratégia organiza as escolhas</text><text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#a9bad1" text-anchor="start" letter-spacing="0">Cada peça tem uma função — e uma pergunta própria.</text><path d="M108 1017 L1812 1017" stroke="#355072" stroke-width="2" stroke-linecap="round" fill="none"/><text x="108" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">OKRs orientam o roadmap. Valoração demonstra a contribuição.</text><text x="1812" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="end" letter-spacing="1">02  /  08</text><rect x="108" y="395" width="392" height="342" rx="28" fill="#132645" stroke="#39d8c2" stroke-width="2"/><circle cx="166" cy="456" r="28" fill="#39d8c2" stroke="none" stroke-width="0"/><text x="166" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">01</text><text x="142" y="529" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="0">OBJETIVO</text><text x="142" y="590" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Qual macro resultado</text><text x="142" y="628" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">a empresa busca?</text><path d="M502 566 L532 566" stroke="#607b9c" stroke-width="4" stroke-linecap="round" fill="none"/><text x="518" y="555" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" fill="#a9bad1" text-anchor="middle" letter-spacing="0">›</text><rect x="540" y="395" width="392" height="342" rx="28" fill="#132645" stroke="#ffbd59" stroke-width="2"/><circle cx="598" cy="456" r="28" fill="#ffbd59" stroke="none" stroke-width="0"/><text x="598" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">02</text><text x="574" y="529" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffbd59" text-anchor="start" letter-spacing="0">RESULTADOS-CHAVE</text><text x="574" y="590" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Quais mudanças mostram</text><text x="574" y="628" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">que chegamos ao resultado?</text><path d="M934 566 L964 566" stroke="#607b9c" stroke-width="4" stroke-linecap="round" fill="none"/><text x="950" y="555" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" fill="#a9bad1" text-anchor="middle" letter-spacing="0">›</text><rect x="972" y="395" width="392" height="342" rx="28" fill="#132645" stroke="#b793ff" stroke-width="2"/><circle cx="1030" cy="456" r="28" fill="#b793ff" stroke="none" stroke-width="0"/><text x="1030" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">03</text><text x="1006" y="529" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#b793ff" text-anchor="start" letter-spacing="0">INDICADORES</text><text x="1006" y="590" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Que medida mostra o</text><text x="1006" y="628" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">avanço e o resultado?</text><path d="M1366 566 L1396 566" stroke="#607b9c" stroke-width="4" stroke-linecap="round" fill="none"/><text x="1382" y="555" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" fill="#a9bad1" text-anchor="middle" letter-spacing="0">›</text><rect x="1404" y="395" width="392" height="342" rx="28" fill="#132645" stroke="#75df9f" stroke-width="2"/><circle cx="1462" cy="456" r="28" fill="#75df9f" stroke="none" stroke-width="0"/><text x="1462" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">04</text><text x="1438" y="529" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#75df9f" text-anchor="start" letter-spacing="0">AÇÕES / PROJETOS</text><text x="1438" y="590" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Que iniciativa pode</text><text x="1438" y="628" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">contribuir para os KRs?</text><rect x="108" y="798" width="1704" height="118" rx="24" fill="#10213c" stroke="none" stroke-width="0"/><text x="150" y="870" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffbd59" text-anchor="start" letter-spacing="0">Regra prática</text><text x="385" y="870" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#f4f7fb" text-anchor="start" letter-spacing="0">O projeto entra como ação candidata. O resultado de negócio continua sendo o KR.</text></svg>