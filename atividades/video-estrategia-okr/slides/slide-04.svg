start" letter-spacing="0">Visibilidade de contratos</text><text x="1000" y="550" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#f4f7fb" text-anchor="start" letter-spacing="0">e automação da apuração</text><circle cx="1095" cy="680" r="42" fill="#39d8c2" stroke="none" stroke-width="0"/><text x="1095" y="692" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">1</text><circle cx="1375" cy="680" r="42" fill="#ffbd59" stroke="none" stroke-width="0"/><text x="1375" y="692" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">2</text><circle cx="1650" cy="680" r="42" fill="#b793ff" stroke="none" stroke-width="0"/><text x="1650" y="692" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0b1730" text-anchor="middle" letter-spacing="0">3</text><path d="M1137 680 L1333 680" stroke="#6c86a7" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M1417 680 L1608 680" stroke="#6c86a7" stroke-width="4" stroke-linecap="round" fill="none"/><text x="1095" y="756" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#a9bad1" text-anchor="middle" letter-spacing="0">REGISTRAR</text><text x="1375" y="756" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#a9bad1" text-anchor="middle" letter-spacing="0">COMPARAR</text><text x="1650" y="756" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#a9bad1" text-anchor="middle" letter-spacing="0">CORRIGIR</text><rect x="1000" y="806" width="755" height="62" rx="18" fill="#1b3655" stroke="none" stroke-width="0"/><text x="1377" y="846" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#f4f7fb" text-anchor="middle" letter-spacing="0">Aprovar se a contribuição, o custo e a capacidade fizerem sentido<