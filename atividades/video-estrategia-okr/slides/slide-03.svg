<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#132b4d"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39d8c2" stop-opacity=".24"/><stop offset="1" stop-color="#b793ff" stop-opacity=".08"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1690" cy="120" r="300" fill="url(#glow)" stroke="none" stroke-width="0"/><circle cx="160" cy="920" r="360" fill="#0f2340" stroke="none" stroke-width="0"/><text x="108" y="74" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="start" letter-spacing="2">ESCRITÓRIO DE PROJETOS  /  ESTRATÉGIA DE TI</text><text x="108" y="157" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#39d8c2" text-anchor="start" letter-spacing="2">SELEÇÃO DO ROADMAP</text><text x="108" y="244" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f4f7fb" text-anchor="start" letter-spacing="0">Projeto é ação. KR é resultado.</text><text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#a9bad1" text-anchor="start" letter-spacing="0">A proposta precisa mostrar o caminho entre a entrega e o objetivo estratégico.</text><path d="M108 1017 L1812 1017" stroke="#355072" stroke-width="2" stroke-linecap="round" fill="none"/><text x="108" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#a9bad1" text-anchor="start" letter-spacing="0">OKRs orientam o roadmap. Valoração demonstra a contribuição.</text><text x="1812" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a9bad1" text-anchor="end" letter-spacing="1">03  /  08</text><rect x="120" y="390" width="420" height="138" rx="2